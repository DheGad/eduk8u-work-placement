version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduk8u_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduk8u
      POSTGRES_USER: eduk8u_user
      POSTGRES_PASSWORD: eduk8u_password_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduk8u_user -d eduk8u"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - eduk8u_network

  redis:
    image: redis:7-alpine
    container_name: eduk8u_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eduk8u_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eduk8u_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      API_VERSION: v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eduk8u
      DB_USER: eduk8u_user
      DB_PASSWORD: eduk8u_password_dev
      DB_SSL: "false"
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eduk8u_network
    profiles:
      - full  # only start backend container when explicitly requested

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  eduk8u_network:
    driver: bridge
