events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # GZIP Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # Frontend Server (SPA)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name app.eduk8u.com;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # API Server Reverse Proxy
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name api.eduk8u.com;

        # Redirect to HTTPS
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # HTTPS Template (Requires valid certs mapped to /etc/nginx/ssl)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name app.eduk8u.com api.eduk8u.com;
        
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        client_max_body_size 25M;

        location / {
            if ($host = 'api.eduk8u.com') {
                proxy_pass http://api:3000;
            }
            if ($host = 'app.eduk8u.com') {
                proxy_pass http://frontend:80;
            }
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # Static uploads folder exposure (optional, ideally served via S3 in enterprise)
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
        }
    }
}
