version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduk8u_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-eduk8u}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${DB_NAME:-eduk8u}
    volumes:
      - eduk8u_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-eduk8u}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduk8u_backend

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduk8u_prod_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${PGUSER:-eduk8u}:${PGPASSWORD}@db:5432/${DB_NAME:-eduk8u}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-eduk8u}
      - DB_USER=${PGUSER:-eduk8u}
      - DB_PASSWORD=${PGPASSWORD}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - API_VERSION=v1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - POSTMARK_SERVER_TOKEN=${POSTMARK_SERVER_TOKEN}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - FRONTEND_URL=${FRONTEND_URL}
      - VULTR_ACCESS_KEY=${VULTR_ACCESS_KEY}
      - VULTR_SECRET_KEY=${VULTR_SECRET_KEY}
      - VULTR_BUCKET_NAME=${VULTR_BUCKET_NAME}
      - VULTR_ENDPOINT=${VULTR_ENDPOINT}
      - VULTR_REGION=${VULTR_REGION}
    volumes:
      - eduk8u_uploads:/app/uploads
    networks:
      - eduk8u_backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduk8u_prod_frontend
    restart: unless-stopped
    networks:
      - eduk8u_frontend

  nginx:
    image: nginx:alpine
    container_name: eduk8u_prod_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - eduk8u_backend
      - eduk8u_frontend

volumes:
  eduk8u_pg_data:
  eduk8u_uploads:

networks:
  eduk8u_backend:
  eduk8u_frontend:
